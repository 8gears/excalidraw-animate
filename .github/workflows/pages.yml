name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # served from https://<owner>.github.io/<repo>/, so assets need that base
      - name: Build app
        working-directory: excalidraw-app
        run: yarn vite build --base="/${{ github.event.repository.name }}/"
        env:
          VITE_APP_DISABLE_SENTRY: "true"
          # excalidraw.com's analytics, not ours
          VITE_APP_DISABLE_ANALYTICS: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: excalidraw-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
